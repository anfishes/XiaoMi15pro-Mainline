SectionVerb {
	EnableSequence [
		cset "name='SECONDARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='SECONDARY_TDM_RX_0 Audio Mixer MultiMedia1' 0"
	]
}

SectionDevice."Speaker" {
	Comment "Internal Speaker"

	EnableSequence [
		# Top speaker (cs35l43@42, prefix "T", TDM slot 0)
		cset "name='T AMP Enable Switch' 1"
		cset "name='T PCM Source' ASPRX1"
		cset "name='T ASPRX1 Slot Position' 0"
		cset "name='T Digital PCM Volume' 409"
		cset "name='T Amp Gain' 14"

		# Bottom speaker (cs35l43@40, prefix "B", TDM slot 1)
		# NOTE: Disabled by default on the bring-up unit due to a hardware amp short.
		# On units with a healthy bottom speaker, set B AMP Enable Switch to 1 and
		# uncomment the lines below:
		cset "name='B AMP Enable Switch' 0"
		# cset "name='B PCM Source' ASPRX1"
		# cset "name='B ASPRX1 Slot Position' 1"
		# cset "name='B Digital PCM Volume' 409"
		# cset "name='B Amp Gain' 14"
	]

	DisableSequence [
		cset "name='T AMP Enable Switch' 0"
		cset "name='B AMP Enable Switch' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
